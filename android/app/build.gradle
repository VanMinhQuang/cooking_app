// This plugins block should be at the very top
plugins {
    id 'com.android.application' // Already declarative via settings.gradle, but good to list here
    id 'com.google.gms.google-services'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin' // Added for Flutter
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// apply plugin: 'com.android.application' // Removed, moved to plugins block
// START: FlutterFire Configuration
// apply plugin: 'com.google.gms.google-services' // Removed, moved to plugins block
// END: FlutterFire Configuration
// apply plugin: 'kotlin-android' // Removed, moved to plugins block
// apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle" // Removed for declarative Flutter plugin

android {
    namespace "vn.test.cooking"  // Required for AGP 8.0+
    compileSdkVersion 35

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        baseline = file("lint-baseline.xml")
    }


    defaultConfig {
        applicationId "vn.test.cooking"
        minSdkVersion 23
        targetSdkVersion 35
        //TODO: 2024-04-15:[Upgrade build] khi upgrade build android can tang version len de chay duoc upgrade auto
        versionCode 1
        versionName '0.0.0'
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias 'meal'
            keyPassword 'Baythatxa@123'
            storePassword 'Baythatxa@123'
            storeFile file('C:/Project/Personal/cooking_app/release/meal.keystore')  // Changed to relative path
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release  // Using release signing config
        }
    }

    // Required for AGP 8.0+
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Needed for AGP 8.0+ to handle resource namespacing
    buildFeatures {
        // Add any build features you need
        buildConfig true
    }
}

flutter {
    source '../..'
}

// Add any additional dependencies your app needs
dependencies {
    // For fixing multidex issues if needed
    implementation 'androidx.multidex:multidex:2.0.1'
}